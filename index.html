/* Desktop-only adjustable blank-space divider. Only this handle receives pointer events in the empty side. */
@media (min-width:801px){
  .workspace{width:calc(100% - var(--side-gap));max-width:none;}
  /* Narrow visual handle, but a comfortable invisible hit target. */
  #space-resizer{position:absolute;z-index:8;left:clamp(0px,calc(100% - var(--side-gap) - 12px),calc(100% - 24px));top:50%;transform:translateY(-50%);width:24px;height:84px;padding:0;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:ew-resize;touch-action:none;-webkit-user-select:none;user-select:none;outline-offset:2px;}
  #space-resizer .grip-core{display:block;position:relative;width:5px;height:46px;border-radius:999px;background:rgba(199,231,220,.84);border:1px solid rgba(240,255,249,.55);box-shadow:0 2px 10px rgba(0,18,24,.34);transition:background .14s,box-shadow .14s;}
  #space-resizer:hover .grip-core,#space-resizer:focus-visible .grip-core,#space-resizer.dragging .grip-core{background:#e2fff3;box-shadow:0 1px 12px rgba(180,245,222,.3);}
  #desk.dragging-space{cursor:ew-resize!important;}
  #desk.dragging-space *{cursor:ew-resize!important;user-select:none!important;-webkit-user-select:none!important;}
}

 body{background:#e8f1f2;color:#273e45}

 #desk::before{opacity:.19;background-image:radial-gradient(circle at 89% 35%,#749f9c3c 0 1px,transparent 1.8px)}
 #desk::after{box-shadow:0 0 0 70px #ffffff0c,0 0 0 145px #ffffff08;border-color:#5e9a9b14}
 .topbar{color:#214c54}.brand-icon{background:linear-gradient(145deg,#247D73 0%,#115458 100%);box-shadow:0 6px 20px #66878e35}.brand p,.topdate{color:#607f85}
 .hello{color:#567e84}.clock{color:#214850}.clock small,.clockhint{color:#587f83}
 .progress-title{color:#28515a}.progress-sub{color:#63858b}
 .currentcard{background:linear-gradient(145deg,#277c78,#24646d);border-color:#a6dad39c;box-shadow:0 13px 38px #5a88944a}
 .subjectcard{background:#fffffff2;border-color:#cddfdb;box-shadow:0 9px 27px #74919a1e}
 .subjectcard:hover{background:#f8fffc;box-shadow:0 12px 28px #78939a35}
 .bottomline{color:#64878c}
 #space-resizer .grip-core{background:#639995!important;border-color:#e1f7ee!important;box-shadow:0 2px 10px #537d7540!important}

}

 .panel-head{border-bottom-color:#36525c}

function hourDisplay(minutes){
 // 时长显示：不足 1 小时显示分钟；1 小时及以上显示小时。
 const m = Math.round(Number(minutes));
 if (!Number.isFinite(m) || m < 0) return '—';
 if (m < 60) return `${m}分钟`;
 if (m % 15 === 0) return `${Number((m / 60).toFixed(2))}小时`;
 const h = Math.floor(m / 60), rest = m % 60;
 return rest ? `${h}小时${rest}分钟` : `${h}小时`;
}

// 自动把当前时段带入右侧时间表视野；只滚动卡片内部，不影响桌面整体位置。
let lastScheduleFocusId=null;
function scrollScheduleToCurrent(sc,animated=false){
 if(nav.view!=='schedule')return;
 const {cur,next}=currentTimeline();
 const taskId=cur?.id||next?.id;
 if(!taskId)return;
 const row=Array.from(sc.querySelectorAll('.timetable tbody tr[data-task]')).find(el=>el.dataset.task===taskId);
 if(!row)return;
 const view=sc.getBoundingClientRect(),item=row.getBoundingClientRect();
 const idealTop=sc.scrollTop+item.top-view.top-(sc.clientHeight-item.height)/2;
 const maxTop=Math.max(0,sc.scrollHeight-sc.clientHeight);
 sc.scrollTo({top:Math.max(0,Math.min(maxTop,idealTop)),behavior:animated?'smooth':'auto'});
}
// Keep the highlighted time block visible inside the timetable card in Plash.
let lastScheduleScrollKey='';
function scrollScheduleToCurrent(sc,force=false){
 const rows=Array.from(sc.querySelectorAll('tbody tr[data-task]'));
 if(!rows.length){lastScheduleScrollKey='';return;}
 const now=new Date(),{cur,next}=currentTimeline(now);
 const match=id=>rows.find(row=>row.dataset.task===id);
 const currentMinute=now.getHours()*60+now.getMinutes();
 const upcomingToday=todayTasks(now.getDay()).find(t=>tod(t.start)>currentMinute);
 const target=match(cur?.id)||match(upcomingToday?.id)||rows[rows.length-1];
 const phase=cur?.id===target.dataset.task?'now':upcomingToday?.id===target.dataset.task?'next':'last';
 const key=dayKey(now)+'|'+target.dataset.task+'|'+phase;
 if(!force&&key===lastScheduleScrollKey)return; // Keep manual scrolling undisturbed between changes.
 const initial=lastScheduleScrollKey==='';
 lastScheduleScrollKey=key;
 const sticky=sc.querySelector('thead')?.getBoundingClientRect().height||0;
 const rowRect=target.getBoundingClientRect(),scRect=sc.getBoundingClientRect();
 const visible=Math.max(0,sc.clientHeight-sticky);
 const desired=sc.scrollTop+rowRect.top-scRect.top-sticky-Math.max(8,(visible-rowRect.height)*0.35);
 const top=Math.max(0,Math.min(Math.max(0,sc.scrollHeight-sc.clientHeight),desired));
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 sc.scrollTo({top,behavior:(initial||force||reduced)?'auto':'smooth'});
}

// 真实的逐秒倒计时。跨午夜的睡眠时段按日期处理，避免出现负数、重复倒计时。
function segmentClock(now=new Date()){
 const {cur,next}=currentTimeline(now);
 if(cur){
  const start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(tod(cur.start)/60),tod(cur.start)%60);
  // 23:00—07:00: 凌晨属于昨天开始的时段。
  if(tod(cur.end)<=tod(cur.start)&&now<start)start.setDate(start.getDate()-1);
  const duration=diff(cur)*60000;
  const end=new Date(start.getTime()+duration);
  return {cur,next,seconds:Math.max(0,Math.ceil((end-now)/1000)),progress:Math.max(0,Math.min(100,(now-start)/duration*100)),endLabel:cur.end};
 }
 if(next){
  const begin=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(tod(next.start)/60),tod(next.start)%60);
  if(begin<=now)begin.setDate(begin.getDate()+1);
  return {cur:null,next,seconds:Math.max(0,Math.ceil((begin-now)/1000)),progress:0,endLabel:next.start};
 }
 return {cur:null,next:null,seconds:0,progress:0,endLabel:'--:--'};
}
function readableCountdown(seconds){
 const sec=Math.max(0,Math.floor(seconds)),hours=Math.floor(sec/3600),minutes=Math.floor((sec%3600)/60),last=sec%60;
 return hours?`${pad(hours)}:${pad(minutes)}:${pad(last)}`:`${pad(minutes)}:${pad(last)}`;
}
function refreshCountdown(now=new Date()){
 const {cur,next,seconds,progress,endLabel}=segmentClock(now),current=cur||next;
 const card=document.getElementById('currentcard');
 document.getElementById('status').textContent=cur?'正在进行':next?'即将开始':'今日已完成';
 document.getElementById('taskname').textContent=current?current.title:'暂无安排';
 document.getElementById('tasktime').textContent=current?`${current.start}—${current.end} · ${current.subject}`:'请在时间表中添加安排';
 document.getElementById('timerlabel').textContent=cur?'剩余时间':next?'距离开始':'今日任务';
 const display=document.getElementById('timeleft');
 display.textContent=current?readableCountdown(seconds):'00:00';
 display.classList.toggle('long-countdown',seconds>=3600);
 document.getElementById('deadline-label').textContent=cur?'结束于':'开始于';
 document.getElementById('deadline').textContent=endLabel;
 const rounded=Math.round(progress);
 document.getElementById('elapsed-label').textContent=cur?`已进行 ${rounded}%`:next?'等待下一项开始':'今日时间表已结束';
 document.getElementById('duration-label').textContent=cur?`总计 ${hourDisplay(diff(cur))}`:'';
 const bar=document.getElementById('timerprogress');
 bar.setAttribute('aria-valuenow',String(rounded));
 document.getElementById('timerline').style.width=progress+'%';
 card.dataset.urgency=cur&&seconds<=600?'urgent':cur&&seconds<=1800?'soon':'normal';
 document.getElementById('nexttask').textContent=next?`${next.start} · ${next.title}`:'今天的计划已结束';
}

 if(b.dataset.video!==undefined){let id=Number(b.dataset.video);state.checkedVideos=done(id)?state.checkedVideos.filter(v=>v!==id):[...state.checkedVideos,id];save();refreshAll(true);toast(done(id)?'视频已标记完成':'已取消视频完成状态');return}
 if(b.dataset.unitcheck!==undefined){let i=Number(b.dataset.unitcheck);state.checkedCircuit=state.checkedCircuit.includes(i)?state.checkedCircuit.filter(v=>v!==i):[...state.checkedCircuit,i];save();refreshAll(true);toast('模块学习状态已更新');return}
 if(b.dataset.taskcheck){checkTask(b.dataset.taskcheck);renderCard(true);toast(taskCheck(b.dataset.taskcheck)?'本时段已打卡':'已取消本时段打卡');return}
 if(b.dataset.task){let t=taskById(b.dataset.task);let s=taskSubject(t);return goto(s?'subject':'task',s?{subject:s,task:t.id}:{task:t.id})}
 if(b.dataset.edit){return goto('edit',{editing:b.dataset.edit})}
 });

 const row=e.target.closest('tr[data-task]');
 if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();row.click()}
});
document.getElementById('desk').addEventListener('input',e=>{let id=e.target.dataset.note;if(id){state.taskNotes[id]=e.target.value;save()}});
document.getElementById('desk').addEventListener('submit',e=>{if(e.target.id!=='editform')return;e.preventDefault();let data=new FormData(e.target);let title=(data.get('title')||'').trim(),start=data.get('start'),end=data.get('end');let error=document.getElementById('editerror');if(!title||!start||!end){error.textContent='请填写名称和时间';return}if(start===end){error.textContent='结束时间需要不同于开始时间';return}let subject=data.get('subject'),type=data.get('type'),desc=(data.get('desc')||'').trim();let item={id:nav.editing||('u'+Date.now()),title,start,end,subject,type,desc,days:[0,1,2,3,4,5,6]};if(nav.editing){let idx=state.schedule.findIndex(t=>t.id===nav.editing);if(idx>=0){item.days=state.schedule[idx].days||item.days;state.schedule[idx]=item}else state.schedule.push(item)}else state.schedule.push(item);save();home();refreshAll();toast('日程已保存')});
// Vertical wheel/touch scrolling in the card is intentional; no horizontal swiping, slide carousels, or page navigation.
let lastMinute='';setInterval(()=>{const now=new Date(),k=dayKey(now)+' '+pad(now.getHours())+':'+pad(now.getMinutes());if(k!==lastMinute){lastMinute=k;refreshAll(true)}else{document.getElementById('seconds').textContent=pad(now.getSeconds());refreshCountdown(now)}},1000);

// Plash/Safari 页面首次显示后再次校准：确保布局尺寸确定时当前时段已进入可视范围。
window.addEventListener('load',()=>{
 if(nav.view==='schedule')requestAnimationFrame(()=>scrollScheduleToCurrent(document.getElementById('panelbody')));
});

// The divider only changes reserved Finder desktop space; card navigation/scrolling are untouched.
const grip=document.getElementById('space-resizer');
const desk=document.getElementById('desk');
const DEFAULT_BLANK_PERCENT=29;
function blankMin(){return 0}
function blankMax(){
 const w=window.innerWidth;
 const minimumContent=w>=1240?810:w>=1020?715:650;
 return Math.min(45,Math.max(blankMin(),(w-minimumContent)/w*100));
}
function applyBlankWidth(p,commit=false){
 const numeric=Number(p);
 let max=blankMax(),percentage=Math.min(max,Math.max(blankMin(),Number.isFinite(numeric)?numeric:DEFAULT_BLANK_PERCENT));
 // At the screen edge, snap the remaining sub-percent sliver entirely shut.
 if(percentage<0.75)percentage=0;
 state.blankPercent=Math.round(percentage*10)/10;
 desk.style.setProperty('--side-gap',state.blankPercent+'vw');
 // vw values track the window width; zero blank area allows the handle to reach the right edge.
 grip.setAttribute('aria-valuenow',String(Math.round(state.blankPercent)));
 grip.setAttribute('aria-valuemax',String(Math.round(max)));
 grip.setAttribute('aria-valuetext','留白占屏幕'+Math.round(state.blankPercent)+'%');
 if(commit) save();
}
let gripPointer=null,gripStart=null;
grip.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;
 e.preventDefault();
 gripPointer=e.pointerId;
 gripStart={x:e.clientX,p:state.blankPercent};
 grip.classList.add('dragging');
 desk.classList.add('dragging-space');
 grip.setPointerCapture(e.pointerId);
});
grip.addEventListener('pointermove',e=>{
 if(e.pointerId!==gripPointer||!gripStart)return;
 // Dragging right increases study panel width and can eliminate the blank area.
 const newPercent=gripStart.p-(e.clientX-gripStart.x)/window.innerWidth*100;
 applyBlankWidth(newPercent);
});
function finishGrip(e){
 if(e.pointerId!==gripPointer)return;
 gripPointer=null;gripStart=null;
 grip.classList.remove('dragging');desk.classList.remove('dragging-space');
 applyBlankWidth(state.blankPercent,true);
}
grip.addEventListener('pointerup',finishGrip);
grip.addEventListener('pointercancel',finishGrip);
grip.addEventListener('lostpointercapture',finishGrip);
grip.addEventListener('keydown',e=>{
 const step=e.shiftKey?5:1;
 if(e.key==='ArrowLeft'){e.preventDefault();applyBlankWidth(state.blankPercent+step,true)}
 else if(e.key==='ArrowRight'){e.preventDefault();applyBlankWidth(state.blankPercent-step,true)}
 else if(e.key==='Home'){e.preventDefault();applyBlankWidth(blankMax(),true)}
 else if(e.key==='End'){e.preventDefault();applyBlankWidth(blankMin(),true)}
});
grip.addEventListener('dblclick',()=>{applyBlankWidth(DEFAULT_BLANK_PERCENT,true);toast('留白宽度已恢复默认')});
window.addEventListener('resize',()=>applyBlankWidth(state.blankPercent));
applyBlankWidth(state.blankPercent);
// 时间表沿用现有宽度和高度，仅调整整体位置，使底边与左侧“科目进度”卡片底边对齐。
// 由真实卡片位置计算位移，避免固定像素在不同 MacBook 屏幕上产生偏差。
const schedulePanel=document.querySelector('.grid > .panel');
const subjectCards=document.querySelector('.overview .subjectcards');
const scheduleGrid=document.querySelector('.grid');
function alignSchedulePanel(){
 if(window.innerWidth<=620){
  schedulePanel.style.removeProperty('--schedule-panel-height');
  schedulePanel.style.removeProperty('--schedule-panel-shift');
  return;
 }
 const gridRect=scheduleGrid.getBoundingClientRect();
 const targetBottom=subjectCards.getBoundingClientRect().bottom;
 // 保留当前时间表的既定高度（比科目进度区底部多 12px），不修改宽高规则。
 const height=Math.max(0,Math.min(gridRect.height,targetBottom+12-gridRect.top));
 schedulePanel.style.setProperty('--schedule-panel-height',Math.round(height)+'px');
 // 先清空旧位移，再以实际绘制出的底边计算偏移，避免旧 transform 和 offsetHeight 造成偏差。
 schedulePanel.style.setProperty('--schedule-panel-shift','0px');
 const renderedBottom=schedulePanel.getBoundingClientRect().bottom;
 const shift=Math.round(targetBottom-renderedBottom);
 schedulePanel.style.setProperty('--schedule-panel-shift',shift+'px');
}
if('ResizeObserver' in window){
 const layoutObserver=new ResizeObserver(alignSchedulePanel);
 layoutObserver.observe(scheduleGrid);
 layoutObserver.observe(subjectCards);
}
window.addEventListener('resize',alignSchedulePanel);
window.addEventListener('load',alignSchedulePanel);
alignSchedulePanel();
requestAnimationFrame(alignSchedulePanel);
</script></body></html>
